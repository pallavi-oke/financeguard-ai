<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCENT in Microsoft Teams — Live Role-Play Demo (Adam Jones & John Smith)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='8' fill='%230f172a'/%3E%3Cpath d='M3.5 30 L11.5 15.5 L15.2 19.8 L22 6.5 L33 30 Z' fill='%231e3a8a'/%3E%3Cpath d='M11.5 15.5 L7.8 22.2 L10.4 21.1 L12 22.8 L14 19.6 Z' fill='%23dbeafe'/%3E%3Cpath d='M22 6.5 L15 20.2 L18 18.7 L20 21.2 L22 16.2 Z' fill='%23ffffff'/%3E%3Cpath d='M22 6.5 L22 16.2 L24.8 19.8 L26.6 18.1 L28.9 21 Z' fill='%2360a5fa'/%3E%3Ccircle cx='22' cy='6.2' r='2' fill='%23fde047'/%3E%3C/svg%3E" />
  <style>
    :root {
      --teams-header: #292841;
      --teams-rail: #33344a;
      --teams-purple: #5b5fc7;
      --teams-purple-hover: #4f52b2;
      --teams-purple-light: #e8ebfa;
      --bg-chat: #f5f5f7;
      --bg-sidebar: #ffffff;
      --card-bg: #ffffff;
      --border: #e1dfdd;
      --text-main: #242424;
      --text-muted: #616161;
      --green: #107c41;
      --green-bg: #e6f4ea;
      --amber: #d83b01;
      --amber-bg: #fef4e8;
      --red: #c50f1f;
      --red-bg: #fde7e9;
      --blue: #0078d4;
      --blue-bg: #e5f1fb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: #e9eaf0;
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* TOP MICROSOFT TEAMS APP BAR + ROLE PLAY SWITCHER */
    .teams-topbar {
      height: 54px;
      background: var(--teams-header);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .teams-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 14px;
    }
    .teams-logo {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(155deg, #0b132b 0%, #1e3a8a 58%, #0284c7 100%);
      border: 1px solid rgba(125, 211, 252, 0.5);
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .everest-svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .northstar-pill {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      color: #e2e8f0;
      font-size: 11.5px;
      padding: 4px 10px;
      border-radius: 999px;
      margin-left: 8px;
    }

    /* ROLE PLAY SWITCHER */
    .persona-switcher {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.28);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .persona-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #cbd5e1;
      padding: 0 8px;
      font-weight: 700;
    }
    .persona-btn {
      border: none;
      background: transparent;
      color: #e2e8f0;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .persona-btn.active {
      background: var(--teams-purple);
      color: #ffffff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
    .persona-btn:hover:not(.active) {
      background: rgba(255,255,255,0.1);
    }

    /* MAIN TEAMS LAYOUT */
    .teams-shell {
      flex: 1;
      display: grid;
      grid-template-columns: 64px 290px 1fr;
      overflow: hidden;
    }

    /* LEFT ICON RAIL */
    .teams-rail {
      background: var(--teams-rail);
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 14px;
      gap: 18px;
      font-size: 10px;
    }
    .rail-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      opacity: 0.7;
    }
    .rail-item.active {
      opacity: 1;
      color: #fff;
      position: relative;
    }
    .rail-item.active::before {
      content: "";
      position: absolute;
      left: -14px;
      top: 4px;
      bottom: 4px;
      width: 3px;
      background: #8b8cc7;
      border-radius: 2px;
    }
    .rail-icon {
      font-size: 18px;
    }
    .rail-ascent-divider {
      width: 28px;
      height: 1px;
      background: rgba(255, 255, 255, 0.16);
      margin: 2px 0;
    }
    .rail-ascent-badge {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: linear-gradient(155deg, #0b132b 0%, #1e3a8a 58%, #0284c7 100%);
      border: 1px solid rgba(125, 211, 252, 0.55);
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.35);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* USE-CASE / SCENARIO LIST SIDEBAR */
    .scenario-sidebar {
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header h2 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }
    .sidebar-header p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .scenario-list {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .scenario-item {
      border: 1px solid transparent;
      background: #f8f9fa;
      border-radius: 8px;
      padding: 11px 12px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
    }
    .scenario-item:hover {
      background: #f0f2f9;
    }
    .scenario-item.active {
      background: var(--teams-purple-light);
      border-color: var(--teams-purple);
    }
    .sc-step {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--teams-purple);
      letter-spacing: 0.04em;
    }
    .sc-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      margin: 2px 0;
    }
    .sc-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.35;
    }

    /* CHAT CANVAS */
    .chat-pane {
      background: var(--bg-chat);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      height: 56px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .bot-avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(155deg, #0b132b 0%, #1e3a8a 58%, #0284c7 100%);
      border: 1.5px solid rgba(125, 211, 252, 0.65);
      box-shadow: 0 3px 8px rgba(15, 23, 42, 0.22);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
    }
    .bot-avatar .everest-svg {
      border-radius: 8.5px;
    }
    .chat-header .bot-avatar::after {
      content: "";
      position: absolute;
      right: -3px;
      bottom: -3px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #10b981;
      border: 2px solid #ffffff;
    }
    .chat-title {
      font-size: 14.5px;
      font-weight: 700;
    }
    .chat-subtitle {
      font-size: 11.5px;
      color: var(--text-muted);
    }
    .active-user-pill {
      font-size: 12px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--teams-purple-light);
      color: var(--teams-purple);
      border: 1px solid #c5cbf5;
    }

    /* MESSAGES STREAM */
    .chat-stream {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
    }

    .sc-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 2px;
    }
    .mode-pill {
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .mode-pill.push {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }
    .mode-pill.pull {
      background: #e0f2fe;
      color: #0369a1;
      border: 1px solid #7dd3fc;
    }

    /* TRIGGER BANNER (SHOWS PUSH VS PULL CLEARLY) */
    .trigger-banner {
      background: #fff;
      border-left: 4px solid var(--teams-purple);
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 9px 14px;
      border-radius: 6px;
      font-size: 12px;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      max-width: 860px;
    }
    .trigger-banner.push-mode {
      border-left-color: #15803d;
      background: linear-gradient(90deg, #f0fdf4 0%, #ffffff 32%);
    }
    .trigger-banner.pull-mode {
      border-left-color: #0284c7;
      background: linear-gradient(90deg, #f0f9ff 0%, #ffffff 32%);
    }
    .trigger-type {
      font-weight: 700;
      color: var(--teams-purple);
      margin-right: 6px;
    }
    .trigger-banner.push-mode .trigger-type {
      color: #166534;
    }
    .trigger-banner.pull-mode .trigger-type {
      color: #0369a1;
    }

    /* USER BUBBLE (WHEN FSE OR FSM ASKS A QUESTION) */
    .user-msg-row {
      display: flex;
      justify-content: flex-end;
      width: 100%;
      max-width: 860px;
      animation: cardSlideIn 0.2s ease-out;
    }
    .user-bubble {
      background: #e8ebfa;
      color: #1e1e2d;
      border: 1px solid #c5cbf5;
      padding: 10px 14px;
      border-radius: 10px 10px 2px 10px;
      font-size: 13px;
      max-width: 540px;
    }
    .user-bubble-meta {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--teams-purple);
      margin-bottom: 3px;
    }
    .bot-followup-bubble {
      background: #ffffff;
      border: 1px solid #d8ddd3;
      border-left: 3.5px solid var(--teams-purple);
      border-radius: 2px 10px 10px 10px;
      padding: 10px 14px;
      font-size: 12.5px;
      line-height: 1.45;
      color: #1e293b;
      max-width: 680px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
      animation: cardSlideIn 0.22s ease-out;
    }

    /* ADAPTIVE CARD CONTAINER */
    .bot-msg-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      width: 100%;
      max-width: 860px;
    }
    .adaptive-card {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid #d2d0ce;
      border-top: 4px solid var(--teams-purple);
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      padding: 16px 18px;
    }
    .ac-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .ac-source {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--teams-purple);
      letter-spacing: 0.04em;
    }
    .ac-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .badge-green { background: var(--green-bg); color: var(--green); }
    .badge-amber { background: var(--amber-bg); color: var(--amber); }
    .badge-red { background: var(--red-bg); color: var(--red); }
    .badge-blue { background: var(--blue-bg); color: var(--blue); }

    .ac-title {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }
    .ac-sub {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* ADAPTIVE CARD FACT SET */
    .ac-facts {
      background: #fafafa;
      border: 1px solid #edebe9;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 12px;
      display: grid;
      grid-template-columns: 155px 1fr;
      row-gap: 6px;
      column-gap: 10px;
      font-size: 12.5px;
    }
    .fact-k { font-weight: 700; color: #484644; }
    .fact-v { color: #242424; }

    /* COMPACT TABLE INSIDE ADAPTIVE CARD */
    .ac-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .ac-table th {
      text-align: left;
      padding: 6px 8px;
      background: #f3f2f1;
      color: #484644;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
    }
    .ac-table td {
      padding: 7px 8px;
      border-bottom: 1px solid #f3f2f1;
    }

    /* GAMIFIED SKILLS PASSPORT (ANIMATED RINGS + 3D FLIP STAMPS + RACE TRACK) */
    @keyframes foilShimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.35); }
      50% { box-shadow: 0 0 0 6px rgba(59, 130, 246, 0); }
    }
    @keyframes amberPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.38); }
      50% { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
    }
    @keyframes streakFlicker {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    @keyframes stampSlam {
      0% { opacity: 0; transform: scale(2.6) rotate(-20deg); }
      65% { opacity: 1; transform: scale(0.92) rotate(-8deg); }
      82% { transform: scale(1.06) rotate(-11deg); }
      100% { opacity: 1; transform: scale(1) rotate(-10deg); }
    }
    @keyframes shockwaveRing {
      0% { opacity: 0.85; transform: translate(-50%, -50%) scale(0.4); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(2.3); }
    }
    @keyframes confettiFall {
      0% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.4); }
    }
    @keyframes cardSlideIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .adaptive-card {
      animation: cardSlideIn 0.24s ease-out;
    }

    /* TOP HERO: APPLE-WATCH STYLE SVG RING + RACE-TO-138d TRACK */
    .gp-level-banner {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 55%, #312e81 100%);
      color: #ffffff;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.22);
    }
    .gp-hero-ring-wrap {
      position: relative;
      width: 68px;
      height: 68px;
      flex-shrink: 0;
    }
    .gp-hero-ring-svg {
      width: 68px;
      height: 68px;
      transform: rotate(-90deg);
    }
    .gp-ring-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.14);
      stroke-width: 6;
    }
    .gp-ring-fg {
      fill: none;
      stroke: url(#gpGrad);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 163.36;
      stroke-dashoffset: 163.36;
      transition: stroke-dashoffset 1s cubic-bezier(0.22, 1, 0.36, 1);
      filter: drop-shadow(0 0 5px rgba(52, 211, 153, 0.55));
    }
    .gp-hero-ring-label {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.05;
    }
    .gp-hero-pct {
      font-size: 15px;
      font-weight: 800;
      color: #6ee7b7;
    }
    .gp-hero-lvl {
      font-size: 9.5px;
      font-weight: 700;
      color: #cbd5e1;
      letter-spacing: 0.04em;
    }

    .gp-hero-right {
      flex: 1;
      min-width: 0;
    }
    .gp-level-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 12.5px;
      font-weight: 700;
      gap: 8px;
      flex-wrap: wrap;
    }
    .gp-streak-pill {
      background: rgba(251, 146, 60, 0.22);
      border: 1px solid rgba(251, 146, 60, 0.6);
      color: #fed7aa;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      animation: streakFlicker 2.2s ease-in-out infinite;
    }

    /* VISUAL RACE-TO-138d TIMELINE */
    .gp-race-wrap {
      position: relative;
      padding-top: 16px;
      padding-bottom: 4px;
    }
    .gp-race-track {
      position: relative;
      height: 8px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
    }
    .gp-race-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #38bdf8, #34d399);
      width: 0%;
      transition: width 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .gp-goal-flag {
      position: absolute;
      left: 65.7%;
      top: -15px;
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: 800;
      color: #fde047;
      white-space: nowrap;
    }
    .gp-goal-line {
      position: absolute;
      left: 65.7%;
      top: -3px;
      bottom: -3px;
      width: 2px;
      background: #fde047;
      box-shadow: 0 0 6px #fde047;
    }
    .gp-runner-dot {
      position: absolute;
      top: 50%;
      left: 69%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fbbf24;
      border: 2px solid #ffffff;
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.9);
      transition: left 0.85s cubic-bezier(0.22, 1, 0.36, 1), background 0.3s ease, box-shadow 0.3s ease;
      z-index: 3;
    }
    .gp-runner-dot.ahead {
      background: #10b981;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.95);
    }
    .gp-gps-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #cbd5e1;
      margin-top: 7px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .gp-eta-highlight {
      color: #fde047;
      font-weight: 800;
      font-size: 12px;
      transition: color 0.3s ease;
    }
    .gp-eta-highlight.ahead {
      color: #6ee7b7;
    }

    /* 3D FLIP COLLECTIBLE SKILL MEDALLION CARDS */
    .gp-badge-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 11px;
      margin-bottom: 12px;
    }
    .gp-flip-scene {
      perspective: 900px;
      height: 168px;
      cursor: pointer;
      position: relative;
    }
    .gp-flip-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }
    .gp-flip-scene:hover .gp-flip-inner {
      transform: translateY(-3px);
    }
    .gp-flip-scene.is-flipped .gp-flip-inner {
      transform: rotateY(180deg);
    }
    .gp-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 10px;
      padding: 11px 9px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      overflow: hidden;
    }
    .gp-face-front.gold {
      border: 1px solid #86efac;
      border-top: 4px solid #10b981;
      background: linear-gradient(120deg, #f0fdf4 30%, #dcfce7 50%, #f0fdf4 70%);
      background-size: 200% 100%;
      animation: foilShimmer 5s linear infinite;
    }
    .gp-face-front.silver {
      border: 1px solid #bfdbfe;
      border-top: 4px solid #3b82f6;
      background: #f8fafc;
      animation: pulseGlow 2.6s infinite;
    }
    .gp-face-front.rusty {
      border: 1px solid #fde68a;
      border-top: 4px solid #f59e0b;
      background: #fffbeb;
      animation: amberPulse 2.2s infinite;
    }
    .gp-face-back {
      transform: rotateY(180deg);
      background: #f8fafc;
      border: 1.5px dashed #64748b;
      justify-content: center;
      gap: 5px;
      padding: 10px;
    }
    .gp-back-title {
      font-size: 11px;
      font-weight: 800;
      color: #1e293b;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid #e2e8f0;
      width: 100%;
      padding-bottom: 3px;
    }
    .gp-stamp-row {
      font-size: 10.8px;
      color: #0f172a;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 2px 6px;
      width: 100%;
      text-align: left;
      font-family: monospace;
    }

    /* MEDALLION SVG RING AROUND EACH SKILL ICON */
    .gp-medallion {
      position: relative;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gp-medallion svg {
      position: absolute;
      inset: 0;
      width: 52px;
      height: 52px;
      transform: rotate(-90deg);
    }
    .gp-med-bg {
      fill: #ffffff;
      stroke: #e2e8f0;
      stroke-width: 4.5;
    }
    .gp-med-fg {
      fill: none;
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-dasharray: 138.2;
      stroke-dashoffset: 138.2;
      transition: stroke-dashoffset 0.95s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.3s ease;
    }
    .gp-med-emoji {
      position: relative;
      z-index: 2;
      font-size: 20px;
    }

    /* RUBBER PASSPORT STAMP SEAL + SHOCKWAVE */
    .gp-stamp-seal {
      position: absolute;
      top: 7px;
      right: 6px;
      border: 2px solid #059669;
      color: #059669;
      background: rgba(236, 253, 245, 0.92);
      font-size: 9px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 4px;
      letter-spacing: 0.05em;
      transform: rotate(-10deg);
      z-index: 5;
      pointer-events: none;
    }
    .gp-stamp-seal.slam {
      animation: stampSlam 0.48s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .gp-shockwave {
      position: absolute;
      left: 50%;
      top: 42%;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 3px solid #10b981;
      pointer-events: none;
      z-index: 15;
      animation: shockwaveRing 0.65s ease-out forwards;
    }

    .gp-badge-title {
      font-size: 12.2px;
      font-weight: 700;
      color: #1e293b;
    }
    .gp-badge-tier {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      letter-spacing: 0.02em;
    }
    .tier-gold { background: #d1fae5; color: #065f46; }
    .tier-silver { background: #dbeafe; color: #1e40af; }
    .tier-rusty { background: #fef3c7; color: #92400e; }

    .gp-badge-sub {
      font-size: 10.6px;
      color: #475569;
      line-height: 1.25;
    }
    .gp-flip-hint {
      font-size: 9.8px;
      color: #64748b;
      font-weight: 600;
    }

    .confetti-dot {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 25;
      animation: confettiFall 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* READINESS IMPACT STRIP (SHOWN ACROSS ALL USE CASES) */
    .impact-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: linear-gradient(90deg, #eef2ff 0%, #ecfdf5 100%);
      border: 1px solid #c7d2fe;
      border-left: 4px solid #4f46e5;
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 11.8px;
      color: #1e293b;
    }
    .impact-pill {
      background: #065f46;
      color: #ecfdf5;
      font-weight: 800;
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* ANIMATED COHORT DIGITAL-TWIN BARS (FSM ACTION 3) */
    .cohort-bars {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 11px 13px;
    }
    .cb-row {
      display: grid;
      grid-template-columns: 145px 1fr 145px;
      align-items: center;
      gap: 10px;
      font-size: 12px;
    }
    .cb-name { font-weight: 700; color: #1e293b; }
    .cb-track {
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      position: relative;
      overflow: hidden;
    }
    .cb-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.65s cubic-bezier(0.22, 1, 0.36, 1), background 0.4s ease;
    }
    .cb-eta {
      font-size: 11.5px;
      font-weight: 700;
      text-align: right;
    }

    /* ADAPTIVE CARD ACTION BUTTONS */
    .ac-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .ac-btn {
      border: 1px solid #8a8886;
      background: #fff;
      color: var(--text-main);
      font-size: 12.5px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.12s;
    }
    .ac-btn.primary {
      background: var(--teams-purple);
      border-color: var(--teams-purple);
      color: #fff;
    }
    .ac-btn.primary:hover {
      background: var(--teams-purple-hover);
    }
    .ac-btn:hover:not(.primary) {
      background: #f3f2f1;
    }

    /* ACTION RESULT TOAST INSIDE CARD */
    .ac-result {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 6px;
      background: var(--green-bg);
      border: 1px solid #a8dab5;
      color: #0d652d;
      font-size: 12.5px;
      font-weight: 600;
      display: none;
    }

    /* NATIVE AI RESULT FEEDBACK BAR (THUMBS UP / THUMBS DOWN) */
    .ac-feedback-bar {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px dashed #e1dfdd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-muted);
    }
    .fb-buttons {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .fb-btn {
      border: 1px solid #d2d0ce;
      background: #fafafa;
      color: #484644;
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.12s;
    }
    .fb-btn:hover {
      background: #f0f2f9;
      border-color: var(--teams-purple);
      color: var(--teams-purple);
    }
    .fb-btn.active-up {
      background: var(--green-bg);
      border-color: var(--green);
      color: var(--green);
    }
    .fb-btn.active-down {
      background: var(--amber-bg);
      border-color: var(--amber);
      color: var(--amber);
    }
    .fb-drawer {
      margin-top: 8px;
      padding: 9px 12px;
      background: #fff9f5;
      border: 1px solid #f5c2a3;
      border-radius: 6px;
      display: none;
      font-size: 12px;
    }
    .fb-drawer-row {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .fb-drawer-row input {
      flex: 1;
      padding: 5px 9px;
      border: 1px solid #c8c6c4;
      border-radius: 4px;
      font-size: 12px;
    }
    .fb-toast {
      margin-top: 8px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--teams-purple);
      display: none;
    }

    /* BOTTOM TEAMS COMPOSE BOX WITH 1-CLICK QUESTION CHIPS */
    .compose-bar {
      background: #fff;
      border-top: 1px solid var(--border);
      padding: 10px 24px 14px;
      flex-shrink: 0;
    }
    .prompt-chips {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .chip-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .prompt-chip {
      background: #f0f2f9;
      border: 1px solid #c5cbf5;
      color: var(--teams-purple);
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
    }
    .prompt-chip:hover {
      background: var(--teams-purple);
      color: #fff;
    }
    .compose-input {
      display: flex;
      gap: 8px;
    }
    .compose-input input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #c8c6c4;
      border-radius: 4px;
      font-size: 13px;
    }

    /* NATIVE TEAMS APP TABS (CHAT | READINESS JOURNEY - DFS TRACKER) */
    .teams-app-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: 16px;
      padding-left: 16px;
      border-left: 1px solid var(--border);
      height: 56px;
    }
    .teams-tab-btn {
      background: transparent;
      border: none;
      height: 100%;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);

      display: inline-flex;
      align-items: center;
      gap: 6px;
      position: relative;
      transition: color 0.15s;
    }
    .teams-tab-btn:hover {
      color: var(--text-main);
    }
    .teams-tab-btn.active {
      color: var(--teams-purple);
      font-weight: 700;
    }
    .teams-tab-btn.active::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 0;
      height: 3px;
      border-radius: 3px 3px 0 0;
      background: var(--teams-purple);
    }
    .dfs-tab-pill {
      background: #dff0e6;
      color: #165b38;
      border: 1px solid #b7dfc7;
      font-size: 10.5px;
      font-weight: 800;
      padding: 1px 7px;
      border-radius: 999px;
      transition: transform 0.25s ease, background 0.25s ease;
    }
    .dfs-tab-pill.synced-pulse {
      background: #10b981;
      color: #ffffff;
      transform: scale(1.12);
    }

    /* EMBEDDED DFS TRACKER PANE (INSPIRED BY BUSINESS TEAM PROTOTYPE) */
    .dfs-tracker-pane {
      display: none;
      flex: 1;
      overflow-y: auto;
      background: #f2f3ee;
      padding: 18px 22px 28px;
      flex-direction: column;
      gap: 16px;
    }
    .dfs-card {
      background: #fafaf7;
      border: 1px solid #dfe2d8;
      border-radius: 14px;
      padding: 18px 22px;
      max-width: 920px;
      width: 100%;
      box-shadow: 0 2px 8px rgba(20, 40, 28, 0.04);
    }
    .dfs-eyebrow {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #1e754c;
      margin-bottom: 6px;
    }
    .dfs-profile-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }
    .dfs-profile-left {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      flex: 1;
      min-width: 280px;
    }
    .dfs-monogram {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: linear-gradient(145deg, #2d8a5b, #1b6b43);
      color: #ffffff;
      font-size: 19px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 3px 8px rgba(27, 107, 67, 0.22);
      margin-top: 4px;
    }
    .dfs-name {
      font-size: 22px;
      font-weight: 800;
      color: #18221d;
      line-height: 1.15;
    }
    .dfs-role-sub {
      font-size: 12.5px;
      color: #5b665f;
      margin-top: 2px;
      margin-bottom: 10px;
    }
    .dfs-meta-grid {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .dfs-meta-item {
      display: flex;
      flex-direction: column;
    }
    .dfs-meta-k {
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #7c867f;
    }
    .dfs-meta-v {
      font-size: 12px;
      font-weight: 600;
      color: #233029;
      margin-top: 1px;
    }
    .dfs-curriculum-line {
      font-size: 12.5px;
      font-weight: 700;
      color: #1c2822;
    }
    .dfs-profile-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .dfs-donut-wrap {
      position: relative;
      width: 86px;
      height: 86px;
      flex-shrink: 0;
    }
    .dfs-donut-wrap svg {
      width: 86px;
      height: 86px;
      transform: rotate(-90deg);
    }
    .dfs-donut-bg {
      fill: none;
      stroke: #e4e5dd;
      stroke-width: 8;
    }
    .dfs-donut-fg {
      fill: none;
      stroke: #1e754c;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 226.2;
      stroke-dashoffset: 226.2;
      transition: stroke-dashoffset 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .dfs-donut-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .dfs-donut-pct {
      font-size: 18px;
      font-weight: 800;
      color: #18221d;
      line-height: 1.05;
    }
    .dfs-donut-lbl {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #6c7770;
      margin-top: 2px;
    }
    .dfs-objective-box {
      border: 1px solid #d8ddd4;
      background: #f4f6f1;
      border-radius: 10px;
      padding: 11px 15px;
      min-width: 215px;
    }
    .dfs-obj-title {
      font-size: 13.5px;
      font-weight: 800;
      color: #1b6b43;
      line-height: 1.3;
      margin-top: 2px;
    }
    .dfs-obj-ascent {
      font-size: 11px;
      font-weight: 700;
      color: #3f469c;
      margin-top: 5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 4-STAGE CAREER ROADMAP (INSPIRATION FROM BUSINESS TEAM SCREENSHOT 2) */
    .dfs-roadmap-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }
    .dfs-legend {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 11px;
      color: #4b554e;
    }
    .dfs-leg-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .dfs-nodes-row {
      display: grid;
      grid-template-columns: 1fr 54px 1fr 54px 1fr 54px 1fr;
      align-items: center;
      justify-items: center;
      padding: 6px 8px 0;
    }
    .dfs-stage-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1.5px solid transparent;
      transition: all 0.18s ease;
      width: 100%;
    }
    .dfs-stage-node:hover {
      background: #f1f4ee;
      border-color: #c5d6cb;
    }
    .dfs-stage-node.selected {
      background: #eef5f0;
      border-color: #1e754c;
      box-shadow: 0 3px 10px rgba(30, 117, 76, 0.1);
    }
    .dfs-circle {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 9px;
    }
    .dfs-circle.complete {
      background: #1b6b43;
      color: #ffffff;
      font-size: 30px;
      font-weight: 800;
      box-shadow: 0 4px 10px rgba(27, 107, 67, 0.22);
    }
    .dfs-circle.in-progress {
      background: #fafaf7;
    }
    .dfs-circle.locked {
      background: #e6e5dc;
      border: 1.5px solid #c8c7be;
      font-size: 24px;
    }
    .dfs-finish-flag {
      position: absolute;
      top: -4px;
      right: -6px;
      font-size: 16px;
    }
    .dfs-stage-name {
      font-size: 13px;
      font-weight: 800;
      color: #1e2822;
      text-align: center;
      margin-bottom: 5px;
    }
    .dfs-stage-node.locked-txt .dfs-stage-name {
      color: #6d756f;
    }
    .dfs-track-pill {
      background: #dff0e6;
      color: #165b38;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.05em;
      padding: 3px 10px;
      border-radius: 999px;
      text-transform: uppercase;
    }
    .dfs-track-pill.risk {
      background: #fde7e9;
      color: #b91c1c;
    }
    .dfs-stage-eta {
      font-size: 10.5px;
      font-weight: 700;
      color: #4b5563;
      margin-top: 4px;
    }
    .dfs-arrow-solid {
      width: 100%;
      height: 2px;
      background: #1b6b43;
      position: relative;
      margin-bottom: 36px;
    }
    .dfs-arrow-solid::after {
      content: "";
      position: absolute;
      right: -2px;
      top: -4px;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 9px solid #1b6b43;
    }
    .dfs-arrow-dashed {
      width: 100%;
      border-top: 2px dashed #b9bcb2;
      position: relative;
      margin-bottom: 36px;
    }
    .dfs-arrow-dashed::after {
      content: "";
      position: absolute;
      right: -2px;
      top: -5px;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 9px solid #b9bcb2;
    }
    .dfs-bypass-svg {
      width: 100%;
      height: 36px;
      display: block;
      margin-top: 2px;
    }
    .dfs-inspector {
      margin-top: 12px;
      background: #eef1fb;
      border: 1px solid #c5cbf5;
      border-left: 4px solid var(--teams-purple);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .dfs-insp-text {

      color: #1e293b;
      flex: 1;

      line-height: 1.4;
    }
    .dfs-mini-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: #f5f7f3;
      border: 1px solid #d6dfd8;
      border-radius: 8px;
      padding: 7px 11px;
      margin-bottom: 12px;
      font-size: 11px;
      font-weight: 700;
      color: #24332b;
      flex-wrap: wrap;
    }
    .dfs-mini-link {
      color: #1b6b43;
      text-decoration: underline;
      cursor: pointer;
      font-weight: 800;
    }
    .dfs-roster-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 14px;
      background: #ffffff;
      border: 1px solid #e2e5dc;
      border-radius: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    /* INLINE DFS TRACKER GRAPHICAL WIDGETS INSIDE TEAMS ADAPTIVE CARDS */
    .ac-dfs-box {
      background: #fafaf7;
      border: 1px solid #d8ddd3;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 14px;
      box-shadow: inset 0 1px 0 #ffffff;
    }
    .ac-dfs-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .ac-dfs-id-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .ac-dfs-mono {
      width: 42px;
      height: 42px;

    function spawnConfettiBurst(targetEl) {
      if (!targetEl) return;
      const colors = ["#10b981", "#facc15", "#38bdf8", "#a855f7", "#fb7185"];
      for (let i = 0; i < 22; i++) {
        const dot = document.createElement("span");
        dot.className = "confetti-dot";
        dot.style.background = colors[i % colors.length];
        dot.style.left = "50%";
        dot.style.top = "38%";
        const angle = (Math.PI * 2 * i) / 22;
        const dist = 36 + Math.random() * 55;
        dot.style.setProperty("--tx", `${Math.cos(angle) * dist}px`);
        dot.style.setProperty("--ty", `${Math.sin(angle) * dist - 12}px`);
        dot.style.setProperty("--rot", `${Math.floor(Math.random() * 360)}deg`);
        targetEl.appendChild(dot);
        setTimeout(() => dot.remove(), 900);
      }
    }

    function animateDayCounter(el, startDay, endDay, suffix = "") {
      if (!el) return;
      const steps = Math.abs(startDay - endDay);
      if (steps === 0) return;
      let current = startDay;
      const dir = endDay < startDay ? -1 : 1;
      const timer = setInterval(() => {
        current += dir;
        el.textContent = `Day ${current}${current === endDay ? suffix : ""}`;
        if (current === endDay) clearInterval(timer);
      }, 65);
    }

        spawnConfettiBurst(simPanel);
        box.style.background = "#e6f4ea";
        box.style.borderColor = "#a8dab5";
        box.style.color = "#0d652d";
        box.textContent = "✅ Correct! Locking the Throttle Valve isolated a faulty valve sensor without venting the chamber (saved 4.5 hrs of downtime). Practice Case 4/10 complete!";
      } else {
        box.style.background = "#fef4e8";
        box.style.borderColor = "#f5c2a3";
        box.style.color = "#d83b01";
        box.textContent = "⚠️ Coaching Tip: Helium leak rate is normal, so venting wastes 4.5 hours. Try Step A to test the valve electronically first.";
      }
    }

    function gradeCryoRefresh(passed) {
      const box = document.getElementById("ac-result-box");
      const refreshPanel = document.getElementById("refresh-panel");
      if (!passed) {
        box.style.display = "block";
        box.style.background = "#fef4e8";
        box.style.borderColor = "#f5c2a3";
        box.style.color = "#d83b01";
        box.textContent = "⚠️ Almost! Opening roughing at 760 Torr backstreams oil/air. Crossover must be below 50 mTorr — tap 'Below 50 mTorr'!";
        return;
      }

      if (refreshPanel) refreshPanel.style.display = "none";

      // Sync live state to DFS Tracker!
      const prevPct = adamCurriculumPct;
      adamCurriculumPct = 92;
      adamRenewalDone = true;
      updateDfsTabPill(true);

      // 1. Un-flip Card 3 if needed, turn Gold, sweep SVG ring & SLAM Passport Stamp + Shockwave!
      const cryoScene = document.getElementById("gp-cryo-scene");
      const cryoFront = document.getElementById("gp-cryo-front");
      const cryoSeal = document.getElementById("gp-cryo-seal");
      const cryoMed = document.getElementById("gp-med-3");
      const cryoEmoji = document.getElementById("gp-cryo-emoji");
      const cryoTier = document.getElementById("gp-cryo-tier");
      const cryoSub = document.getElementById("gp-cryo-sub");
      const cryoBackNote = document.getElementById("gp-cryo-back-note");

      if (cryoScene) cryoScene.classList.remove("is-flipped");
      if (cryoFront) {
        cryoFront.className = "gp-face gp-face-front gold";
        const wave = document.createElement("div");
        wave.className = "gp-shockwave";
        cryoFront.appendChild(wave);
        setTimeout(() => wave.remove(), 700);
        spawnConfettiBurst(cryoScene);
      }
      if (cryoMed) {
        cryoMed.style.stroke = "#10b981";
        cryoMed.style.strokeDashoffset = "0";
      }
      if (cryoEmoji) cryoEmoji.textContent = "🏅";
      if (cryoTier) {
        cryoTier.className = "gp-badge-tier tier-gold";
        cryoTier.textContent = "3/3 VERIFIED";
      }
      if (cryoSub) cryoSub.textContent = "Renewed for 90 days";
      if (cryoBackNote) {
        cryoBackNote.style.borderColor = "#10b981";
        cryoBackNote.style.color = "#065f46";
        cryoBackNote.textContent = "✓ Refresher Passed (Active 90d)";
      }
      if (cryoSeal) {
        cryoSeal.style.display = "block";
        cryoSeal.classList.remove("slam");
        void cryoSeal.offsetWidth;
        cryoSeal.classList.add("slam");
      }

      // 2. Sweep Inline DFS Tracker Curriculum Ring (74% -> 92%)
      const heroArc = document.getElementById("gp-hero-arc");
      const nodeArc = document.getElementById("gp-node-arc");
      const heroPct = document.getElementById("gp-hero-pct");
      const nodePct = document.getElementById("gp-node-pct");
      const installEta = document.getElementById("gp-install-eta");
      const installSub = document.getElementById("gp-install-sub");
      const topBadge = document.getElementById("ac-top-badge");

      if (heroArc) heroArc.style.strokeDashoffset = (157.1 * (1 - 0.92)).toFixed(1);
      if (nodeArc) nodeArc.style.strokeDashoffset = (125.7 * (1 - 0.92)).toFixed(1);

      let p = prevPct;
      const pTimer = setInterval(() => {
        p += 2;
        if (p >= 92) { p = 92; clearInterval(pTimer); }
        if (heroPct) heroPct.textContent = `${p}%`;
        if (nodePct) nodePct.textContent = `${p}%`;
      }, 45);

      if (installEta) {
        installEta.style.color = "#1b6b43";
        installEta.textContent = "All Active ✅";
      }
      if (installSub) {
        installSub.textContent = "Valid for 90 days";
      }
      if (topBadge) {
        topBadge.className = "ac-badge badge-green";
        topBadge.textContent = "All Qualifications Active ✅";
      }

      box.style.display = "block";
      box.style.background = "#e6f4ea";
      box.style.borderColor = "#a8dab5";
      box.style.color = "#0d652d";
      box.textContent = "🎉 Cryo Pump renewed for 90 days! Secondary Installer curriculum jumped to 92% — no 6-day lab retake needed.";
    }

    function triggerCardAction(actionIdx) {
      const sc = DATA[currentPersona].scenarios[currentScenarioIndex];
      const box = document.getElementById("ac-result-box");
      const rpPanel = document.getElementById("roleplay-panel");
      const simPanel = document.getElementById("faultsim-panel");
      const refreshPanel = document.getElementById("refresh-panel");

      if (rpPanel) rpPanel.style.display = "none";
      if (simPanel) simPanel.style.display = "none";
      if (refreshPanel) refreshPanel.style.display = "none";

      // Interactive 2-Min Pre-Job Check in FSE Use Case 2
      if (sc.id === "fse_checklist" && actionIdx === 0) {
        rpPanel.style.display = "block";
        box.style.display = "none";
        return;
      }

      // Playable Sustainer Fault Simulator in FSE Use Case 4
      if (sc.id === "fse_sustainer_sim" && actionIdx === 0) {
        simPanel.style.display = "block";
        box.style.display = "none";
        return;
      }

      // Interactive FSM Use Case 4 Sign-Off animates inline DFS Tracker ring (74% -> 84%)
      if (sc.id === "fsm_ojt_signoff" && actionIdx === 0) {
        adamCurriculumPct = Math.max(adamCurriculumPct, 84);
        updateDfsTabPill(true);
        const sArc = document.getElementById("signoff-dfs-arc");
        const sPct = document.getElementById("signoff-dfs-pct");
        const sNote = document.getElementById("signoff-dfs-note");
        const sBox = document.getElementById("signoff-dfs-box");
        if (sArc) sArc.style.strokeDashoffset = (157.1 * (1 - adamCurriculumPct / 100)).toFixed(1);
        if (sPct) sPct.textContent = `${adamCurriculumPct}%`;
        if (sNote) sNote.textContent = "✓ Recorded in JourneyHub";
        if (sBox) spawnConfettiBurst(sBox);
      }

      // Interactive FSM Use Case 5 Cohort Pace Rebalance animates inline cohort card
      if (sc.id === "fsm_pace_recovery" && actionIdx === 0) {
        saraFixed = true;
        updateDfsTabPill(true);
        const saraTile = document.getElementById("sara-tile");
        const saraMono = document.getElementById("sara-mono");
        const saraSub = document.getElementById("sara-sub");
        const saraEta = document.getElementById("sara-eta");
        const saraRing = document.getElementById("sara-ring");
        const cohortBox = document.getElementById("cohort-bars-box");
        const topBadge = document.getElementById("ac-top-badge");
        if (saraTile) saraTile.classList.remove("at-risk");
        if (saraMono) saraMono.style.background = "linear-gradient(145deg, #2d8a5b, #1b6b43)";
        if (saraSub) saraSub.textContent = "Fab 4 PMs assigned";
        if (saraRing) saraRing.setAttribute("stroke", "#1e754c");
        if (sEta_check(saraEta)) {
          saraEta.className = "dfs-track-pill";
          saraEta.textContent = "On Track";
        }
        if (cohortBox) spawnConfettiBurst(cohortBox);
        if (topBadge) {
          topBadge.className = "ac-badge badge-green";
          topBadge.textContent = "9 of 9 Hires On Track";
        }
      }

      // Interactive Skill Renewal animations in FSE Use Case 3
      if (sc.id === "fse_passport") {
        if (actionIdx === 0) {
          if (refreshPanel) refreshPanel.style.display = "block";
          box.style.display = "none";
          return;
        } else if (actionIdx === 1) {
          const vacScene = document.getElementById("gp-vac-scene");
          if (vacScene) {
            vacScene.classList.toggle("is-flipped");
            spawnConfettiBurst(vacScene);
          }
        }
      }

      const reply = sc.card.actions[actionIdx].reply;
      box.style.display = "block";
      box.style.background = "#e6f4ea";
      box.style.borderColor = "#a8dab5";
      box.style.color = "#0d652d";
      box.textContent = reply;
    }

    function sEta_check(el) { return !!el; }

    function gradeRolePlay(choice) {
      const box = document.getElementById("ac-result-box");
      box.style.display = "block";

      if (choice === "pass") {
        box.style.background = "#e6f4ea";
        box.style.borderColor = "#a8dab5";
        box.style.color = "#0d652d";
        box.textContent = "✅ Passed (95%): Checking N2 interlock, cable torque, and Auto-Tune fixes most post-swap RF issues. Ready for Mentor M. Chen!";
      } else if (choice === "vent") {
        box.style.background = "#fef4e8";
        box.style.borderColor = "#f5c2a3";
        box.style.color = "#d83b01";
        box.textContent = "⚠️ Coaching Tip: Don't vent the chamber first (adds 4 hrs downtime). Check external cable torque & Auto-Tune first (Option A).";
      } else if (choice === "escalate") {
        box.style.background = "#fef4e8";
        box.style.borderColor = "#f5c2a3";
        box.style.color = "#d83b01";
        box.textContent = "⚠️ Coaching Tip: Run the 2-minute external checks (N2 interlock & Auto-Tune) before paging a Senior FSE. Try Option A.";
      } else {
        const custom = document.getElementById("rp-custom-ans").value.trim() || "Check coax torque and run Auto-Tune";
        box.style.background = "#e6f4ea";
        box.style.borderColor = "#a8dab5";
        box.style.color = "#0d652d";
        box.textContent = `✅ Passed (95%): "${custom}" matches BKM-4.2. Ready for Mentor M. Chen!`;
      }
    }

    function askFollowUp(qText, aHtml) {
      if (currentTeamsTab !== "chat") switchTeamsTab("chat");
      const stream = document.getElementById("chat-stream");
      const speaker = currentPersona === "fse" ? "Adam Jones (FSE)" : "John Smith (Manager)";

      const userRow = document.createElement("div");
      userRow.className = "user-msg-row";
      userRow.innerHTML = `
        <div class="user-bubble">
          <div class="user-bubble-meta">${speaker} · 💬 Pull Query</div>
          ${qText}
        </div>
      `;
      stream.appendChild(userRow);

      const botRow = document.createElement("div");
      botRow.className = "bot-msg-row";
      botRow.innerHTML = `
        <div class="bot-avatar" title="ASCENT Onboarding Assistant">
          <svg class="everest-svg"><use href="#everest-peak"></use></svg>
        </div>
        <div class="bot-followup-bubble">
          <div style="font-size:10.5px; font-weight:800; color:#5b5fc7; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:3px;">ASCENT · Live System Lookup</div>
          ${aHtml}
        </div>
      `;
      stream.appendChild(botRow);
      stream.scrollTo({ top: stream.scrollHeight, behavior: "smooth" });
    }

    function sendCustomQuestion() {
      const input = document.getElementById("chat-input");
      const raw = input.value.trim();
      const q = raw.toLowerCase();
      if (!q) return;
      input.value = "";

      if (currentPersona === "fse") {
        if (q.includes("sim") || q.includes("fault") || q.includes("practice")) {
          renderScenario(3);
          return;
        }
        let ans = "📋 <strong>JourneyHub Curriculum Status:</strong> You are at <strong>" + adamCurriculumPct + "%</strong> on NovaDep Oxide CVD Secondary Installer (On Track). Remember: WBT/ILT enrollments and OJT bookings are approved by your manager John Smith.";
        if (q.includes("tool") || q.includes("torque") || q.includes("bkm")) {
          ans = "🧰 <strong>BKM-4.2 Quick Pull:</strong> Bring a calibrated <strong>18 in-lbs torque wrench</strong>, verify N2 purge interlock LED is green, and confirm post-PM Helium leak rate &lt; 1.0E-9 cc/s.";
        } else if (q.includes("loto") || q.includes("safety") || q.includes("prereq")) {
          ans = "🛡️ <strong>Safety Gate:</strong> LOTO &amp; High-Voltage Safety (WBT-101) and all prerequisite WBTs must be 100% complete before ILT lab enrollment or fab OJT.";
        } else if (q.includes("enroll") || q.includes("book")) {
          ans = "🔒 <strong>Role Guardrail:</strong> FSEs cannot self-enroll in WBTs/ILTs or self-book OJT. ASCENT already routed your eligibility to Manager John Smith for 1-click enrollment.";
        }
        askFollowUp(raw, ans);
      } else {
        if (q.includes("q4") || q.includes("nov 18") || q.includes("install") || q.includes("who") || q.includes("bottleneck")) {
          renderScenario(5);
          return;
        }
        let ans = "📊 <strong>Cohort Live Summary:</strong> " + (saraFixed ? "All <strong>9 of 9 trainees</strong> are now On Track for Secondary Installer." : "<strong>8 of 9 trainees</strong> are On Track; Sara Lin is 3 weeks behind pace in Bay 2 and can be moved to upcoming Fab 4 PMs.");
        if (q.includes("travel") || q.includes("640") || q.includes("phoenix") || q.includes("cost")) {
          ans = "💰 <strong>ROI Check:</strong> Approving $640 Phoenix travel (or $0 Local Alternate ILT-305B) avoids a 2-week waitlist stall worth ~$8,400 in Q4 contractor backfill.";
        } else if (q.includes("sara") || q.includes("bay 2")) {
          ans = "📉 <strong>Bay 2 Bottleneck:</strong> Bay 2 has only 1 scheduled PM through Nov 15 due to a customer qual freeze, whereas Fab 4 Bay 4 has 6 PMs with open mentor capacity.";
        }
        askFollowUp(raw, ans);
      }
    }

    // Initialize
    switchPersona("fse");
  </script>
